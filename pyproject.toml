[project]
name = "gradtrack"
version = "0.1.0"
description = "Singapore graduate role tracker — reads company career sites directly, not job boards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "streamlit>=1.38",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Phase 5 only. A handful of career sites render their job list entirely in JS and expose
# no JSON feed. Playwright is a ~400MB browser download, so it stays optional and its CI
# leg is a separate workflow: a browser failure must never block the JSON pipeline.
browser = ["playwright>=1.47"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradtrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Network tests are opt-in: `uv run pytest -m network`. The default run must never depend on
# a careers site being reachable, or a firm's outage starts looking like a code regression.
addopts = "-m 'not network'"
markers = ["network: hits a live endpoint; excluded from the default run"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
